
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle de Estoque e Vendas</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 25px;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #222;
      }

      header {
        background: #243b53;
        color: white;
        padding: 25px;
        border-radius: 12px;
      }

      h1 {
        margin-top: 0;
      }

      main {
        max-width: 1000px;
        margin: 20px auto;
      }

      section {
        background: white;
        padding: 20px;
        margin: 18px 0;
        border-radius: 10px;
        box-shadow: 0 2px 8px #0001;
      }

      input,
      button {
        padding: 12px;
        margin: 5px 3px;
        border-radius: 6px;
        font-size: 16px;
      }

      input {
        border: 1px solid #888;
      }

      button {
        background: #243b53;
        color: white;
        border: 2px solid #243b53;
        cursor: pointer;
      }

      button:hover {
        background: #365b7d;
      }

      button:focus,
      input:focus {
        outline: 3px solid #e09f20;
        outline-offset: 2px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }

      th,
      td {
        border-bottom: 1px solid #ddd;
        padding: 12px;
        text-align: left;
      }

      th {
        background: #e8edf2;
      }

      #mensagem {
        font-weight: bold;
        padding: 10px;
      }

      .alto-contraste {
        background: #000;
        color: #fff;
      }

      .alto-contraste section,
      .alto-contraste header {
        background: #000;
        color: #fff;
        border: 2px solid #fff;
      }

      .alto-contraste input,
      .alto-contraste th,
      .alto-contraste td {
        background: #000;
        color: #fff;
        border: 1px solid #fff;
      }

      .alto-contraste button {
        background: #ffeb00;
        color: #000;
        border: 2px solid #ffeb00;
      }

      .fonte-grande {
        font-size: 21px;
      }

      .fonte-grande input,
      .fonte-grande button {
        font-size: 20px;
      }

      @media (max-width: 600px) {
        body {
          padding: 10px;
        }

        input {
          width: 100%;
        }

        table {
          font-size: 13px;
        }

        section {
          overflow-x: auto;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <header>
        <h1>Controle de Estoque e Vendas</h1>
        <p>Gestão simples e organizada para sua loja.</p>
      </header>

      <section aria-label="Recursos de acessibilidade">
        <h2>Acessibilidade</h2>
        <button id="contraste" type="button">Ativar alto contraste</button>
        <button id="fonte" type="button">Aumentar fonte</button>
      </section>

      <section>
        <h2>Cadastro de produtos</h2>
        <form id="formProduto">
          <label for="nome">Nome do produto</label><br />
          <input id="nome" required placeholder="Ex.: Camiseta" />

          <label for="quantidade">Quantidade</label><br />
          <input id="quantidade" type="number" min="0" required />

          <label for="preco">Preço (R$)</label><br />
          <input id="preco" type="number" min="0.01" step="0.01" required />

          <button type="submit">Cadastrar produto</button>
        </form>
      </section>

      <section>
        <h2>Consultar estoque</h2>
        <label for="busca">Buscar produto</label>
        <input id="busca" placeholder="Digite o nome do produto" />
        <div id="resultadoBusca" aria-live="polite"></div>

        <h3>Produtos cadastrados</h3>
        <table>
          <thead>
            <tr>
              <th>Produto</th>
              <th>Quantidade</th>
              <th>Preço</th>
            </tr>
          </thead>
          <tbody id="listaProdutos"></tbody>
        </table>
      </section>

      <section>
        <h2>Registrar venda</h2>
        <form id="formVenda">
          <label for="produtoVenda">Produto</label><br />
          <select id="produtoVenda" required>
            <option value="">Selecione um produto</option>
          </select>

          <br />
          <label for="quantidadeVenda">Quantidade vendida</label><br />
          <input id="quantidadeVenda" type="number" min="1" required />

          <button type="submit">Registrar venda</button>
        </form>
      </section>

      <section>
        <h2>Resumo do estoque</h2>
        <p id="totalProdutos">Produtos cadastrados: 0</p>
        <p id="alertaEstoque">Produtos com estoque baixo: 0</p>
      </section>

      <p id="mensagem" role="status" aria-live="polite"></p>
    </main>

    <script type="module">
      import { Estoque } from './estoque.js';

      const estoque = new Estoque();

      estoque.produtos = JSON.parse(localStorage.getItem('produtos') || '[]');

      const mensagem = document.getElementById('mensagem');

      function salvar() {
        localStorage.setItem('produtos', JSON.stringify(estoque.produtos));
      }

      function avisar(texto) {
        mensagem.textContent = texto;
      }

      function atualizarTela() {
        const lista = document.getElementById('listaProdutos');
        const select = document.getElementById('produtoVenda');

        lista.innerHTML = '';
        select.innerHTML = '<option value="">Selecione um produto</option>';

        estoque.produtos.forEach((produto) => {
          const linha = document.createElement('tr');

          [
            produto.nome,
            produto.quantidade,
            'R$ ' + Number(produto.preco).toFixed(2),
          ].forEach((valor) => {
            const celula = document.createElement('td');
            celula.textContent = valor;
            linha.appendChild(celula);
          });

          lista.appendChild(linha);

          const opcao = document.createElement('option');
          opcao.value = produto.nome;
          opcao.textContent = produto.nome;
          select.appendChild(opcao);
        });

        document.getElementById('totalProdutos').textContent =
          'Produtos cadastrados: ' + estoque.produtos.length;

        const baixos = estoque.produtos.filter((p) => p.quantidade <= 5).length;

        document.getElementById('alertaEstoque').textContent =
          'Produtos com estoque baixo: ' + baixos;
      }

      document
        .getElementById('formProduto')
        .addEventListener('submit', (event) => {
          event.preventDefault();

          const nome = document.getElementById('nome').value.trim();
          const quantidade = Number(
            document.getElementById('quantidade').value
          );
          const preco = Number(document.getElementById('preco').value);

          try {
            if (estoque.consultarProduto(nome)) {
              throw new Error('Produto já cadastrado.');
            }

            estoque.adicionarProduto(nome, quantidade, preco);
            salvar();
            atualizarTela();
            event.target.reset();
            avisar('Produto cadastrado com sucesso!');
          } catch (erro) {
            avisar(erro.message);
          }
        });

      document
        .getElementById('formVenda')
        .addEventListener('submit', (event) => {
          event.preventDefault();

          const nome = document.getElementById('produtoVenda').value;
          const quantidade = Number(
            document.getElementById('quantidadeVenda').value
          );

          try {
            estoque.venderProduto(nome, quantidade);
            salvar();
            atualizarTela();
            event.target.reset();
            avisar('Venda registrada com sucesso!');
          } catch (erro) {
            avisar(erro.message);
          }
        });

      document.getElementById('busca').addEventListener('input', (event) => {
        const nome = event.target.value.trim();
        const resultado = document.getElementById('resultadoBusca');

        if (!nome) {
          resultado.textContent = '';
          return;
        }

        const produto = estoque.consultarProduto(nome);

        resultado.textContent = produto
          ? `${produto.nome}: ${produto.quantidade} unidades disponíveis.`
          : 'Produto não encontrado.';
      });

      document.getElementById('contraste').addEventListener('click', () => {
        document.body.classList.toggle('alto-contraste');
      });

      document.getElementById('fonte').addEventListener('click', () => {
        document.body.classList.toggle('fonte-grande');
      });

      atualizarTela();
    </script>
  </body>
</html>
